  <style>
    .nv { font-size: 14px; letter-spacing: .01em; text-decoration: none; padding: 6px 0; position: relative; color: var(--charcoal); }
    .nv::after { content: ""; position: absolute; left: 0; right: 100%; bottom: 0; height: 1px; background: var(--charcoal); transition: right .18s cubic-bezier(.2,.8,.2,1); }
    .nv:hover::after { right: 0; }
    .nv-on::after { right: 0; background: var(--sage); }
    .icn { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.1; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
    .hd-desk { display: flex; }
    .hd-mob { display: none; }
    @media (max-width: 1080px) { .hd-desk { display: none; } .hd-mob { display: flex; } }

<header style="position: sticky; top: 0; z-index: 60; background: {{ hdBg }}; backdrop-filter: blur(10px); border-bottom: 1px solid var(--color-border-subtle); transition: background .18s cubic-bezier(.2,.8,.2,1);">
  <div class="container" style="display: flex; align-items: center; justify-content: space-between; gap: 28px; height: {{ hdH }}; transition: height .18s cubic-bezier(.2,.8,.2,1);">
    <a href="Inicio.dc.html" aria-label="2skin · inicio" style="display: flex; align-items: center; gap: 12px; flex: 0 0 auto; text-decoration: none;">
      <img src="assets/2skin-monogram-charcoal.png" alt="" style="height: 38px; width: auto; display: block;">
      <img src="assets/2skin-wordmark-charcoal.png" alt="2skin Medical Aesthetics" style="height: 20px; width: auto; display: block;">
    </a>

    <nav class="hd-desk" style="align-items: center; gap: 26px; flex: 1 1 auto; justify-content: center;">
      <a href="Tratamientos.dc.html" class="{{ clsTrat }}">Tratamientos</a>
      <a href="Diagnostico.dc.html" class="{{ clsDiag }}">Diagnóstico</a>
      <a href="Resultados.dc.html" class="{{ clsRes }}">Resultados</a>
      <a href="Nosotros.dc.html" class="{{ clsNos }}">Nosotros</a>
      <a href="Bonos.dc.html" class="{{ clsBonos }}">Bonos</a>
      <a href="Preguntas.dc.html" class="{{ clsFaq }}">Preguntas</a>
    </nav>

    <div style="display: flex; align-items: center; gap: 8px; flex: 0 0 auto;">
      <a href="Cuenta.dc.html" class="hd-desk" aria-label="Mi piel" style="align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; text-decoration: none; color: var(--color-text-secondary); font-size: 13px; letter-spacing: .05em; text-transform: uppercase;" style-hover="color: var(--charcoal)">
        <svg class="icn"><use href="#i-user"></use></svg>
        <span>Mi piel</span>
      </a>
      <a href="Carrito.dc.html" aria-label="Ver carrito" style="display: flex; align-items: center; gap: 9px; min-height: 44px; padding: 0 14px; text-decoration: none; border: 1px solid var(--color-border-default); border-radius: 4px; color: var(--charcoal); font-size: 13px; letter-spacing: .05em; text-transform: uppercase;" style-hover="background: rgba(30,30,30,.04)">
        <svg class="icn"><use href="#i-cart"></use></svg>
        <span style="min-width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; background: {{ badgeBg }}; color: {{ badgeFg }}; font-size: 11px; letter-spacing: 0;">{{ count }}</span>
      </a>
      <a href="Reserva.dc.html" class="tsk-btn tsk-btn--primary tsk-btn--sm hd-desk" style="text-decoration: none;"><span class="tsk-btn__label">Agendar valoración</span></a>
      <button onClick="{{ toggle }}" class="hd-mob" aria-label="Abrir menú" style="min-width: 44px; min-height: 44px; align-items: center; justify-content: center; background: transparent; border: 1px solid var(--color-border-default); border-radius: 4px; color: var(--charcoal); cursor: pointer;">
        <svg class="icn"><use href="{{ menuIcon }}"></use></svg>
      </button>
    </div>
  </div>

  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
    <div class="container" style="padding-bottom: 28px; border-top: 1px solid var(--color-border-subtle); padding-top: 12px; display: flex; flex-direction: column;">

      <a href="Diagnostico.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 14px 0; font-family: var(--font-display); font-size: 24px; text-decoration: none; border-bottom: 1px solid var(--color-border-subtle);"><svg class="icn"><use href="#i-doc"></use></svg>Diagnóstico de piel</a>
      <a href="Resultados.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 14px 0; font-family: var(--font-display); font-size: 24px; text-decoration: none; border-bottom: 1px solid var(--color-border-subtle);"><svg class="icn"><use href="#i-eye"></use></svg>Resultados</a>
      <a href="Nosotros.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 14px 0; font-family: var(--font-display); font-size: 24px; text-decoration: none; border-bottom: 1px solid var(--color-border-subtle);"><svg class="icn"><use href="#i-pin"></use></svg>Nosotros</a>
      <a href="Bonos.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 14px 0; font-family: var(--font-display); font-size: 24px; text-decoration: none; border-bottom: 1px solid var(--color-border-subtle);"><svg class="icn"><use href="#i-gift"></use></svg>Bonos de regalo</a>
      <a href="Cuenta.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 14px 0; font-family: var(--font-display); font-size: 24px; text-decoration: none; border-bottom: 1px solid var(--color-border-subtle);"><svg class="icn"><use href="#i-user"></use></svg>Mi piel</a>
      <a href="Preguntas.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 14px 0; font-family: var(--font-display); font-size: 24px; text-decoration: none;"><svg class="icn"><use href="#i-chat"></use></svg>Preguntas frecuentes</a>
      <a href="Reserva.dc.html" class="tsk-btn tsk-btn--primary" style="margin-top: 20px; text-decoration: none;"><span class="tsk-btn__label">Agendar valoración</span></a>
    </div>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { open: false, count: 0, scrolled: false };

  componentDidMount() {
    const sync = () => this.setState({ count: (window.SITE && window.SITE.cartCount()) || 0 });
    sync();
    this._sync = sync;
    window.addEventListener("2skin:cart", sync);
    window.addEventListener("storage", sync);
    if (!window.SITE) setTimeout(sync, 200);
    this._scroll = () => {
      const s = window.scrollY > 24;
      if (s !== this.state.scrolled) this.setState({ scrolled: s });
    };
    this._scroll();
    window.addEventListener("scroll", this._scroll, { passive: true });
  }
  componentWillUnmount() {
    window.removeEventListener("2skin:cart", this._sync);
    window.removeEventListener("storage", this._sync);
    window.removeEventListener("scroll", this._scroll);
  }

  renderVals() {
    const a = this.props.active || "";
    const cls = k => "nv" + (a === k ? " nv-on" : "");
    const n = this.state.count;
    return {
      hdH: this.state.scrolled ? "72px" : "88px",
      hdBg: this.state.scrolled ? "rgba(246,244,240,.96)" : "rgba(246,244,240,.86)",
      open: this.state.open,
      toggle: () => this.setState(s => ({ open: !s.open })),
      menuIcon: this.state.open ? "#i-close" : "#i-menu",
      count: n,
      badgeBg: n > 0 ? "var(--charcoal)" : "transparent",
      badgeFg: n > 0 ? "var(--cream)" : "var(--color-text-muted)",
      clsTrat: cls("tratamientos"), clsDiag: cls("diagnostico"), clsBonos: cls("bonos"),
      clsRes: cls("resultados"), clsNos: cls("nosotros"), clsFaq: cls("preguntas")
    };
  }
}
</script>

<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  state = { page: "Inicio.dc.html" };

  // Los DC de página se cargan en caliente, así que sus rutas de imagen no pasan
  // por el empaquetador. Reasignamos cada src al recurso ya resuelto del pool.
  installAssetMap() {
    const pool = document.getElementById("asset-pool");
    if (!pool) return;
    const map = {};
    [...pool.querySelectorAll("img")].forEach(i => {
      const key = i.getAttribute("data-k");
      const resolved = i.currentSrc || i.src;
      if (key && resolved) map[key] = resolved;
    });
    if (!Object.keys(map).length) return;
    const fix = root => {
      const imgs = root.querySelectorAll ? root.querySelectorAll("img") : [];
      [...imgs].forEach(i => {
        if (i.closest("#asset-pool")) return;
        const s = i.getAttribute("src") || "";
        if (!s || s.indexOf("blob:") === 0 || s.indexOf("data:") === 0) return;
        const hit = map[s.split("/").pop()];
        if (hit && hit !== s) i.setAttribute("src", hit);
      });
    };
    fix(document.body);
    const obs = new MutationObserver(muts => {
      muts.forEach(m => {
        [...m.addedNodes].forEach(n => { if (n.nodeType === 1) fix(n); });
        if (m.type === "attributes" && m.target.tagName === "IMG") fix(m.target.parentNode || document.body);
      });
    });
    obs.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ["src"] });
    this._obs = obs;
  }

  componentDidMount() {
    window.__2SKIN_SINGLE = true;
    if (window.SITE && window.SITE.installRouter) window.SITE.installRouter();
    setTimeout(() => this.installAssetMap(), 400);
    this.sync();
    this._h = () => this.sync();
    window.addEventListener("hashchange", this._h);
  }
  componentWillUnmount() { window.removeEventListener("hashchange", this._h); }

  static PAGES = ["Inicio", "Tratamientos", "Tratamiento", "Diagnostico",
    "Bonos", "Carrito", "Reserva", "Confirmacion", "Cuenta", "Resultados", "Preguntas", "Nosotros"];

  sync() {
    const r = window.SITE ? window.SITE.route() : { page: "" };
    let name = r.page || "";
    try { name = decodeURIComponent(name); } catch (e) {}
    name = name.replace(/\.dc\.html$/, "");
    const ok = Component.PAGES.indexOf(name) >= 0;
    this.setState({ page: (ok ? name : "Inicio") + ".dc.html" });
  }

  renderVals() {
    const p = this.state.page;
    const is = n => p === n + ".dc.html";
    return {
      isInicio: is("Inicio"), isTratamientos: is("Tratamientos"), isTratamiento: is("Tratamiento"),
      isDiagnostico: is("Diagnostico"),
      isBonos: is("Bonos"), isCarrito: is("Carrito"), isReserva: is("Reserva"),
      isConfirmacion: is("Confirmacion"), isCuenta: is("Cuenta"), isResultados: is("Resultados"),
      isPreguntas: is("Preguntas"), isNosotros: is("Nosotros")
    };
  }
}
</script>
